<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="KAY LIVE SPORT live football and match scores">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>KAY LIVE SPORT</title>
<link rel="icon" href="./icon.png">
<link rel="stylesheet" href="./style.css?v=10">
<script src="./app.js?v=6" defer></script>
<script src="./hls.min.js" defer></script>
<script src="./sutbong.js?v=8" defer></script>
</head>
<body>
<header>
<div class="header-inner">
<div class="header-brand"><img src="./icon.png" width="40" height="40" alt=""><strong>KAY LIVE <span>SPORT</span></strong></div>
<nav aria-label="Sections"><button id="watch" aria-pressed="true">Watch</button><button id="scores" aria-pressed="false">Scores</button></nav>
<div class="header-actions"><button id="theme" type="button">Light theme</button><a href="../kay-live-sport/">Download apps</a></div>
</div>
</header>
<main>
<h1>ဘောလုံးပွဲစဉ်များ</h1>
<section id="watch-view">
<div class="watch-layout">
<dialog class="player-panel" id="player-panel" aria-labelledby="player-title">
<div class="row player-heading"><h2 id="player-title">Live player</h2><button id="close-player" type="button" autofocus>Close player</button></div>
<div class="player" id="player"></div>
<p id="playing" role="status"></p>
<div id="sutbong-channels" aria-label="Commentary"></div>
</dialog>
<section class="matches-panel" aria-labelledby="live-heading">
<div class="row"><div><h2 id="live-heading"><span class="live-dot"></span> Sutbong Live</h2>
<p id="sutbong-status" role="status">Live ပွဲစာရင်း ယူနေပါတယ်…</p></div><button id="sutbong-refresh" type="button">Refresh</button></div>
<div id="sutbong-matches" class="grid"></div>
</section>
<section class="matches-panel" aria-labelledby="upcoming-heading">
<div class="row"><div><h2 id="upcoming-heading">Upcoming matches</h2>
<p id="upcoming-status" role="status">လာမယ့်ပွဲစာရင်း ယူနေပါတယ်…</p></div></div>
<div id="upcoming-matches" class="grid"></div>
</section>
</div>
</section>
<section id="scores-view" hidden>
<div class="row"><h2>Football scores</h2><button id="refresh">Refresh</button></div>
<p id="scores-status" role="status"></p>
<div id="fixtures" class="grid"></div>
</section>
</main>
</body>
</html>
