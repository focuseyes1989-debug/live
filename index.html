<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="KAY LIVE SPORT live football and match scores">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>KAY LIVE SPORT</title>
<link rel="icon" href="./icon.png">
<link rel="stylesheet" href="./style.css?v=22">
<script src="./app.js?v=10" defer></script>
<script src="./hls.min.js" defer></script>
<script src="./sutbong.js?v=14" defer></script>
</head>
<body>
<header>
<div class="header-inner">
<a href="/" class="header-brand" aria-label="KAY LIVE SPORT home"><img src="./icon.png" width="40" height="40" alt=""><strong>KAY LIVE <span>SPORT</span></strong></a>
<div class="header-search"><input id="match-search" type="search" aria-label="Search live and upcoming matches by team or league" placeholder="Search team or league…" aria-controls="sutbong-matches upcoming-matches" autocomplete="off"></div>
<nav aria-label="Sections"><a id="watch" href="#watch-view" aria-current="page">Watch live</a></nav>
<div class="header-actions"><button id="theme" class="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch to dark theme"><svg class="theme-sun" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><svg class="theme-moon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20.9 13.4A9 9 0 0 1 10.6 3.1 9 9 0 1 0 20.9 13.4Z"/></svg></button><a class="header-download" href="../kay-live-sport/">Download apps</a></div>
</div>
</header>
<main>
<h1>ဘောလုံးပွဲစဉ်များ</h1>
<section id="watch-view">
<div class="watch-layout">
<dialog class="player-panel" id="player-panel" aria-labelledby="player-title">
<div class="row player-heading"><h2 id="player-title">Live player</h2><button id="close-player" type="button" aria-label="Close player" title="Close player" autofocus><span aria-hidden="true">×</span></button></div>
<div class="player" id="player"></div>
<p id="playing" role="status"></p>
<div id="sutbong-channels" aria-label="Commentary"></div>
</dialog>
<section class="matches-panel" aria-labelledby="live-heading">
<div class="row"><div><h2 id="live-heading"><span class="live-dot"></span> Sutbong Live</h2>
<p id="sutbong-status" role="status">Live ပွဲစာရင်း ယူနေပါတယ်…</p></div><button id="sutbong-refresh" type="button">Refresh</button></div>
<div id="sutbong-matches" class="grid"></div>
</section>
<section class="matches-panel" aria-labelledby="upcoming-heading">
<div class="row"><div><h2 id="upcoming-heading">Upcoming matches</h2>
<p id="upcoming-status" role="status">လာမယ့်ပွဲစာရင်း ယူနေပါတယ်…</p></div></div>
<div id="upcoming-matches" class="grid"></div>
</section>
</div>
</section>
</main>
</body>
</html>
