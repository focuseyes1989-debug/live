name: Publish live website
on:
  push:
    branches: [main]
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refresh Sutbong match list
        env:
          SUTBONG_CATALOG_URL: ${{ vars.SUTBONG_CATALOG_URL }}
        run: |
          for attempt in 1 2 3; do
            if python3 update_sutbong.py; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 3; fi
          done
          echo "::warning::Sutbong refresh failed after three attempts"
          python3 - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from urllib.request import urlopen

          snapshot = Path("sutbong-matches.json")
          try:
              with urlopen("https://focuseyes1989-debug.github.io/live/sutbong-matches.json", timeout=10) as response:
                  previous = json.load(response)
              published_at = datetime.fromisoformat(previous["updated"])
              checked_in_at = datetime.fromisoformat(json.loads(snapshot.read_text())["updated"])
              if published_at > checked_in_at and isinstance(previous["matches"], list):
                  snapshot.write_text(json.dumps(previous, ensure_ascii=False), encoding="utf-8")
                  print("Kept the newer published snapshot")
          except (OSError, ValueError, KeyError, TypeError) as error:
              print(f"Could not reuse published snapshot: {error}")
          PY
      - name: Prepare pages
        env:
          SUTBONG_CATALOG_URL: ${{ vars.SUTBONG_CATALOG_URL }}
        run: |
          mkdir _site
          cp index.html style.css app.js mobile.js manifest.webmanifest icon.png sutbong.js sutbong-matches.json hls.min.js HLS-LICENSE.txt myanmar-tv-channels.json _site/
          cp -r tv-channels _site/
          if [ -n "$SUTBONG_CATALOG_URL" ]; then
            python3 - <<'PY'
          import html
          import os
          from pathlib import Path
          from urllib.parse import urlsplit

          endpoint = os.environ["SUTBONG_CATALOG_URL"]
          url = urlsplit(endpoint)
          if url.scheme != "https" or not url.hostname or url.path != "/matches.json" or url.username or url.query or url.fragment:
              raise ValueError("SUTBONG_CATALOG_URL must be an HTTPS /matches.json endpoint")
          page = Path("_site/index.html")
          markup = page.read_text(encoding="utf-8")
          page.write_text(markup.replace('name="sutbong-catalog" content=""',
                                         f'name="sutbong-catalog" content="{html.escape(endpoint)}"'), encoding="utf-8")
          PY
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deploy
