name: Publish live website
on:
  push:
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refresh Sutbong match list
        run: python3 update_sutbong.py || echo "::warning::Sutbong refresh failed, using the checked-in snapshot"
      - name: Prepare pages
        run: |
          mkdir _site
          cp index.html style.css app.js icon.png sutbong.js sutbong-matches.json hls.min.js HLS-LICENSE.txt _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deploy
